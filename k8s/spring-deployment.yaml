apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-app
  namespace: devops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-app
  template:
    metadata:
      labels:
        app: student-app
    spec:
      initContainers:
      - name: wait-for-mysql
        image: busybox
        command:
          - sh
          - -c
          - |
            echo "Waiting for MySQL on port 3306..."
            until nc -z mysql 3306; do
              sleep 2
            done
            echo "MySQL is ready"

      containers:
      - name: student-app
        image: khalildridi9/student-management:latest
        imagePullPolicy: Always
        ports:
          - containerPort: 8081
        env:
          - name: SPRING_DATASOURCE_URL
            value: jdbc:mysql://mysql:3306/studentdb?createDatabaseIfNotExist=true
          - name: SPRING_DATASOURCE_USERNAME
            value: studentuser
          - name: SPRING_DATASOURCE_PASSWORD
            value: studentpass
          - name: SERVER_PORT
            value: "8081"
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 20
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 40
          periodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: student-service
  namespace: devops
spec:
  selector:
    app: student-app
  ports:
    - port: 8081
      targetPort: 8081
  type: NodePort

