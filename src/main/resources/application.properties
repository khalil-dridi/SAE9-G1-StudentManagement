spring.application.name=student-management

# Connexion à MySQL dans Docker
spring.datasource.url=jdbc:mysql://db:3306/studentdb?createDatabaseIfNotExist=true
spring.datasource.username=studentuser
spring.datasource.password=studentpass

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server configuration//
server.port=8081
server.servlet.context-path=/student

